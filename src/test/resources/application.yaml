spring:
  docker:
    compose:
      skip:
        in-tests: true

iam:
  http:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  oauth:
    issuer: http://localhost:8080
  security:
    # Test/local development only. Production systems should use secure external key management.
    secret-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    signing-key-file: target/test-signing-key.properties
    allow-signing-key-generation: true

app:
  admin-console:
    frontend-base-url: http://localhost:5173
